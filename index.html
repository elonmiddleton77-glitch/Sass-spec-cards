<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sassafras Spec Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#241d17">
<link rel="manifest" href="manifest.json">
<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spec Cards">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1712;
    --wood:#241d17;
    --wood-2:#2e251c;
    --parchment:#f3e9d4;
    --parchment-2:#ece0c6;
    --copper:#b8733d;
    --copper-bright:#d68a4c;
    --amber:#c17817;
    --sage:#6f7a5e;
    --line: rgba(28,23,18,0.18);
    --shadow: rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #33291d 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, #2b2118 0%, transparent 55%),
      var(--wood);
    color:var(--parchment);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }

  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand .eyebrow{
    font-size:11px;
    letter-spacing:0.3em;
    color:var(--copper-bright);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(28px,5vw,42px);
    margin:0;
    color:var(--parchment);
    letter-spacing:0.01em;
  }
  .brand .sub{
    font-size:12px;
    color:rgba(243,233,212,0.55);
    margin-top:6px;
    letter-spacing:0.04em;
  }

  .controls{
    width:100%;
    max-width:560px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:20px;
  }
  .chip{
    background:transparent;
    border:1px solid rgba(243,233,212,0.25);
    color:rgba(243,233,212,0.75);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--copper-bright); color:var(--parchment);}
  .chip.active{
    background:var(--copper);
    border-color:var(--copper);
    color:var(--ink);
    font-weight:600;
  }

  .stage{
    width:100%;
    max-width:420px;
    perspective:1600px;
  }

  .counter{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(243,233,212,0.5);
    margin-bottom:10px;
    padding:0 4px;
  }
  .counter span.num{ color:var(--copper-bright); font-weight:600; }

  .card{
    position:relative;
    width:100%;
    aspect-ratio: 5 / 6.6;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    background:var(--parchment);
    color:var(--ink);
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
  }
  .face::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(28,23,18,0.05) 28px);
    pointer-events:none;
  }
  .face .hole{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:34px; height:8px; border-radius:6px;
    background:rgba(28,23,18,0.08);
    border:1px solid rgba(28,23,18,0.15);
  }

  .front{
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 26px;
  }
  .front .tag{
    font-size:10px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
    margin-bottom:14px;
  }
  .front h2{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(24px,6vw,34px);
    line-height:1.08;
    margin:0 0 16px;
  }
  .front .glass{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(28,23,18,0.55);
    border-top:1px solid var(--line);
    padding-top:12px;
    margin-top:6px;
  }
  .front .flip-hint{
    position:absolute;
    bottom:16px;
    font-size:9px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:rgba(28,23,18,0.35);
  }

  .back{
    transform: rotateY(180deg);
    padding:34px 24px 20px;
  }
  .back .b-tag{
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
    margin-bottom:2px;
  }
  .back h3{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size:20px;
    margin:0 0 12px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .back .ingredients{
    list-style:none;
    margin:0 0 12px;
    padding:0;
    font-size:12.5px;
    line-height:1.55;
    flex:0 0 auto;
  }
  .back .ingredients li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px dashed rgba(28,23,18,0.15);
    padding:3px 0;
  }
  .back .ingredients li .amt{
    color:var(--amber);
    font-weight:600;
    white-space:nowrap;
  }
  .back .build{
    font-size:11px;
    line-height:1.55;
    color:rgba(28,23,18,0.8);
    overflow-y:auto;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .back .build .lbl{
    color:var(--sage);
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:9.5px;
    display:block;
    margin-bottom:4px;
  }

  .star-btn{
    position:absolute;
    top:14px;
    right:14px;
    z-index:5;
    background:none;
    border:none;
    cursor:pointer;
    font-size:20px;
    line-height:1;
    color:rgba(28,23,18,0.25);
    transition:transform .15s ease, color .15s ease;
    padding:4px;
  }
  .star-btn:hover{ transform:scale(1.15); }
  .star-btn.on{ color:var(--amber); }

  .fav-toggle{
    background:transparent;
    border:1px solid var(--amber);
    color:var(--amber);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
    margin-bottom:14px;
  }
  .fav-toggle:hover{ background:rgba(193,120,23,0.15); }
  .fav-toggle.on{ background:var(--amber); color:var(--ink); font-weight:600; }
  .fav-toggle .n{ opacity:0.7; margin-left:4px; }

  .empty-state{
    text-align:center;
    color:rgba(243,233,212,0.5);
    font-size:13px;
    line-height:1.6;
    padding:60px 20px;
  }

  .navrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:22px;
  }
  .navbtn{
    background:var(--wood-2);
    border:1px solid rgba(243,233,212,0.2);
    color:var(--parchment);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:10px 16px;
    border-radius:4px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .navbtn:hover{ background:var(--copper); color:var(--ink); border-color:var(--copper); }
  .navbtn.icon{ padding:10px 14px; font-size:16px; line-height:1; }
  .navbtn:disabled{ opacity:0.3; cursor:not-allowed; }
  .navbtn:disabled:hover{ background:var(--wood-2); color:var(--parchment); border-color:rgba(243,233,212,0.2); }

  @media (max-width:480px){
    .back .ingredients{ font-size:11.5px; }
    .back h3{ font-size:18px; }
  }
</style>
</head>
<body>

<div class="brand">
  <div class="eyebrow">Sassafras · Behind the Bar</div>
  <h1>Spec Cards</h1>
  <div class="sub">Tap a card to flip · 59 builds</div>
</div>

<div class="controls" id="filters"></div>

<button class="fav-toggle" id="favToggle">☆ Favorites Only <span class="n" id="favCount">(0)</span></button>
<button class="fav-toggle" id="resetFav" style="border-color:rgba(243,233,212,0.25); color:rgba(243,233,212,0.55); margin-left:8px;">Clear Favorites</button>

<div class="stage">
  <div class="counter">
    <span id="catLabel">All</span>
    <span><span class="num" id="idxNum">1</span> / <span id="idxTotal">59</span></span>
  </div>
  <div class="card" id="card">
    <div class="face front">
      <div class="hole"></div>
      <button class="star-btn" id="starFront">☆</button>
      <div class="tag" id="fTag">Gin</div>
      <h2 id="fName">Aviation</h2>
      <div class="glass" id="fGlass">Coupe</div>
      <div class="flip-hint">tap to flip</div>
    </div>
    <div class="face back">
      <div class="hole"></div>
      <button class="star-btn" id="starBack">☆</button>
      <div class="b-tag" id="bTag">Gin</div>
      <h3 id="bName">Aviation</h3>
      <ul class="ingredients" id="bIng"></ul>
      <div class="build"><span class="lbl">Build</span><span id="bBuild"></span></div>
    </div>
  </div>
  <div class="navrow">
    <button class="navbtn icon" id="prevBtn">‹</button>
    <button class="navbtn" id="shuffleBtn">Shuffle</button>
    <button class="navbtn icon" id="nextBtn">›</button>
  </div>
</div>

let deck = DATA.map((d,i)=>({...d, idx:i}));
let order = deck.map((_,i)=>i);
let pos = 0;
let flipped = false;
let activeCat = "All";
let favOnly = false;
let favorites = new Set();
let storageReady = false;

const categories = ["All", ...new Set(DATA.map(d=>d.cat))];

const filtersEl = document.getElementById('filters');
categories.forEach(cat=>{
  const b = document.createElement('button');
  b.className = 'chip' + (cat==='All' ? ' active' : '');
  b.textContent = cat;
  b.onclick = ()=> setFilter(cat);
  filtersEl.appendChild(b);
});

async function loadFavorites(){
  try{
    const raw = localStorage.getItem('sassafras-favorites');
    if(raw){
      const arr = JSON.parse(raw);
      favorites = new Set(arr);
    }
  }catch(err){
    // no saved favorites yet — that's fine, start empty
    favorites = new Set();
  }
  storageReady = true;
  rebuildOrder();
  render();
}

async function saveFavorites(){
  try{
    localStorage.setItem('sassafras-favorites', JSON.stringify([...favorites]));
  }catch(err){
    console.error('Could not save favorites:', err);
  }
}

function rebuildOrder(){
  order = deck.filter(d=>
    (activeCat === 'All' || d.cat === activeCat) &&
    (!favOnly || favorites.has(d.idx))
  ).map(d=>d.idx);
  pos = 0;
}

function setFilter(cat){
  activeCat = cat;
  [...filtersEl.children].forEach(c=> c.classList.toggle('active', c.textContent===cat));
  rebuildOrder();
  render();
}

function toggleFavorite(){
  const item = deck[order[pos]];
  if(item === undefined) return;
  if(favorites.has(item.idx)) favorites.delete(item.idx);
  else favorites.add(item.idx);
  saveFavorites();
  updateFavUI();
  if(favOnly){ rebuildOrder(); }
  render();
}

function updateFavUI(){
  document.getElementById('favCount').textContent = `(${favorites.size})`;
}

function render(){
  const card = document.getElementById('card');
  const stage = document.querySelector('.stage');
  updateFavUI();

  if(!storageReady){
    card.style.display = 'none';
    let loading = document.getElementById('loadingState');
    if(!loading){
      loading = document.createElement('div');
      loading.id = 'loadingState';
      loading.className = 'empty-state';
      loading.textContent = "Loading your saved favorites…";
      stage.appendChild(loading);
    }
    return;
  } else {
    const loading = document.getElementById('loadingState');
    if(loading) loading.remove();
  }

  if(order.length === 0){
    card.style.display = 'none';
    document.querySelectorAll('.navrow button').forEach(b=> b.disabled = true);
    document.getElementById('catLabel').textContent = activeCat;
    document.getElementById('idxNum').textContent = 0;
    document.getElementById('idxTotal').textContent = 0;
    let empty = document.getElementById('emptyState');
    if(!empty){
      empty = document.createElement('div');
      empty.id = 'emptyState';
      empty.className = 'empty-state';
      empty.textContent = "No favorites yet. Flip a card and tap the star to save it here for studying.";
      stage.appendChild(empty);
    }
    return;
  } else {
    const empty = document.getElementById('emptyState');
    if(empty) empty.remove();
    card.style.display = '';
    document.querySelectorAll('.navrow button').forEach(b=> b.disabled = false);
  }

  card.classList.remove('flipped');
  flipped = false;
  const item = deck[order[pos]];

  document.getElementById('fTag').textContent = item.cat;
  document.getElementById('fName').textContent = item.name;
  document.getElementById('fGlass').textContent = item.glass;

  document.getElementById('bTag').textContent = item.cat;
  document.getElementById('bName').textContent = item.name;
  document.getElementById('bBuild').textContent = item.build;

  const isFav = favorites.has(item.idx);
  ['starFront','starBack'].forEach(id=>{
    const el = document.getElementById(id);
    el.textContent = isFav ? '★' : '☆';
    el.classList.toggle('on', isFav);
  });

  const ul = document.getElementById('bIng');
  ul.innerHTML = '';
  item.ing.forEach(([amt,name])=>{
    const li = document.createElement('li');
    li.innerHTML = `<span class="name">${name}</span><span class="amt">${amt}</span>`;
    ul.appendChild(li);
  });

  document.getElementById('catLabel').textContent = activeCat;
  document.getElementById('idxNum').textContent = pos+1;
  document.getElementById('idxTotal').textContent = order.length;
}

document.getElementById('card').addEventListener('click', ()=>{
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').onclick = (e)=>{
  e.stopPropagation();
  pos = (pos - 1 + order.length) % order.length;
  render();
};
document.getElementById('nextBtn').onclick = (e)=>{
  e.stopPropagation();
  pos = (pos + 1) % order.length;
  render();
};
document.getElementById('shuffleBtn').onclick = (e)=>{
  e.stopPropagation();
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  pos = 0;
  render();
};

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight'){ document.getElementById('nextBtn').click(); }
  if(e.key==='ArrowLeft'){ document.getElementById('prevBtn').click(); }
  if(e.key===' '){ e.preventDefault(); document.getElementById('card').click(); }
  if(e.key.toLowerCase()==='f'){ toggleFavorite(); }
});

['starFront','starBack'].forEach(id=>{
  document.getElementById(id).addEventListener('click', (e)=>{
    e.stopPropagation();
    toggleFavorite();
  });
});

document.getElementById('favToggle').addEventListener('click', ()=>{
  favOnly = !favOnly;
  document.getElementById('favToggle').classList.toggle('on', favOnly);
  document.getElementById('favToggle').firstChild.textContent = favOnly ? '★ Favorites Only ' : '☆ Favorites Only ';
  rebuildOrder();
  render();
});

document.getElementById('resetFav').addEventListener('click', async ()=>{
  if(favorites.size === 0) return;
  if(!confirm('Clear all favorited cocktails?')) return;
  favorites = new Set();
  await saveFavorites();
  if(favOnly){ rebuildOrder(); }
  updateFavUI();
  render();
});

loadFavorites();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline support unavailable, app still works online */ });
  });
}
</script>
